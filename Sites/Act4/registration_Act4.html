<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Registration</title>
</head>
<body>
    <header>
        <div class="title">
        <h1>My Personal Website</h1>
        <p>Welcome to my Personal Student Portal</p>
        </div>
        <nav>
            <ul class="link">
                <li><a href="index_Act4.html">Home</a></li>
                <li><a href="profile_Act4.html">Profile</a></li>
                <li><a href="registration_Act4.html" aria-current="page">Registration</a></li>
                <li><a href="grades_Act4.html">Grades</a></li>
            </ul>
        </nav>
    </header>
    
    <main class="registration">
        <div class="card">
        <h2>Student Registration Form</h2>
        <section>
        <form class="form">
            <label for="name">Student Name: </label><br>
            <input type="text" id="name" class="input"><br>

            <label for="email">Email: </label><br>
            <input type="email" id="email" class="input"><br>

            <label for="password">Password: </label><br>
            <input type="password" id="password" class="input"><br>

            <label>Gender: </label>
            <input type="radio" id="male" name="gender">
            <label for="male">Male</label>

            <input type="radio" id="female" name="gender">
            <label for="female">Female</label>

            <br>
            <label for="Course">Course</label><br>
            <select class="input" id="Course">
                <option value="Select Courses">Select Courses</option>
                <option value="it">IT</option>
                <option value="cs">CS</option>
            </select>
            <br>

            <label>Skills</label><br>
            <input type="checkbox" id="html">
            <label for="html">HTML</label>

            <input type="checkbox" id="css">
            <label for="css">CSS</label>

            <input type="checkbox" id="javascript">
            <label for="javascript">JavaScript</label><br><br>

            <label>Profile Picture: </label><br>
            <input type="file">

            <br><br>

            <label for="address">Address: </label><br>
            <textarea id="address" class="input"></textarea>
            <br><br>
    
            <button type="submit" class="button">Submit</button><br><br>
            <button type="reset" class="button">Reset</button>
         
        </form>
        </section>
        </div>
    </main>
        
    <footer>
        <p>© 2026 My Personal Website</p>
    </footer>    
</body>
</html>
